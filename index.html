<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>码道小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    background: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }

  /* 手机屏幕：375 × 720 */
  .phone {
    position: relative;
    width: 375px;
    height: 720px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ededed;
  }

  /* 屏幕比手机大时居中显示，加个阴影；375 宽时正好铺满 */
  @media (min-width: 420px), (min-height: 760px) {
    body {
      display: grid;
      place-items: center;
      background: #b9b9b9;
      overflow: hidden;
    }
    .phone {
      box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
    }
  }

  /* ---------- 标题栏 ---------- */
  .navbar {
    position: relative;
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ededed;
    border-bottom: 1px solid #d8d8d8;
    z-index: 2;
  }
  .navbar .title {
    font-size: 17px;
    font-weight: 600;
    color: #101010;
    letter-spacing: .3px;
  }
  .navbar .back,
  .navbar .more {
    position: absolute;
    top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    color: #2c2c2c;
  }
  .navbar .back { left: 6px; }
  .navbar .more { right: 8px; }

  /* ---------- 聊天区 ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px 12px;
    background: #ededed;
    scroll-behavior: smooth;
    transition: opacity .35s ease;
  }
  .chat::-webkit-scrollbar { width: 0; }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-bottom: 20px;
  }
  .msg.me { flex-direction: row-reverse; }

  /* 头像 */
  .avatar {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    user-select: none;
  }
  .avatar.bot  { background: linear-gradient(135deg, #4c8bf5, #2f6fe0); }
  .avatar.user { background: linear-gradient(135deg, #8fd06a, #5fae42); }

  /* 气泡 */
  .bubble {
    position: relative;
    max-width: 248px;
    padding: 9px 12px;
    border-radius: 8px;              /* 圆角 8px */
    font-size: 15px;
    line-height: 1.45;
    color: #111;
    word-break: break-word;
    background: #fff;                /* 对方：白气泡 */
    animation: bubble-in .26s cubic-bezier(.2, .9, .3, 1) both;
  }
  .msg.me .bubble {
    background: #95ec69;             /* 我：微信绿 #95ec69 */
  }

  /* 气泡左侧 / 右侧的小尖角 */
  .bubble::before {
    content: "";
    position: absolute;
    top: 12px;
    width: 0;
    height: 0;
    border: 7px solid transparent;
  }
  .msg.bot .bubble::before {
    left: -12px;
    border-right-color: #fff;
    border-left-width: 0;
  }
  .msg.me .bubble::before {
    right: -12px;
    border-left-color: #95ec69;
    border-right-width: 0;
  }

  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  /* ---------- “正在输入” 三点动效 ---------- */
  .bubble.typing {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 13px 14px;
  }
  .bubble.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #b3b3b3;
    animation: dot-bounce 1.1s infinite ease-in-out;
  }
  .bubble.typing span:nth-child(2) { animation-delay: .16s; }
  .bubble.typing span:nth-child(3) { animation-delay: .32s; }

  @keyframes dot-bounce {
    0%, 60%, 100% { opacity: .35; transform: translateY(0); }
    30%           { opacity: 1;   transform: translateY(-3px); }
  }

  /* ---------- 底部输入栏 ---------- */
  .inputbar {
    flex: 0 0 56px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: #f7f7f7;
    border-top: 1px solid #dcdcdc;
  }
  .iconbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    color: #4a4a4a;
    flex: 0 0 28px;
    cursor: pointer;
  }
  .input {
    flex: 1;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: #fff;
    border-radius: 6px;
    font-size: 14px;
    color: #b6b6b6;
  }
</style>
</head>
<body>

  <div class="phone">

    <!-- 标题栏 -->
    <div class="navbar">
      <div class="back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 5 8 12 15 19"></polyline>
        </svg>
      </div>
      <div class="title">码道小助手</div>
      <div class="more">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.8"></circle>
          <circle cx="12" cy="12" r="1.8"></circle>
          <circle cx="19" cy="12" r="1.8"></circle>
        </svg>
      </div>
    </div>

    <!-- 聊天区（内容由脚本逐条插入） -->
    <div class="chat">
      <!-- 没有 JS 时的兜底内容 -->
      <div class="msg bot">
        <div class="avatar bot">码</div>
        <div class="bubble">在吗？</div>
      </div>
      <div class="msg me">
        <div class="avatar user">我</div>
        <div class="bubble">在的，怎么啦？</div>
      </div>
    </div>

    <!-- 底部输入栏 -->
    <div class="inputbar">
      <div class="iconbtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M8.5 10.5v3M12 8.5v7M15.5 10.5v3"></path>
        </svg>
      </div>
      <div class="input">发消息…</div>
      <div class="iconbtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="9" cy="10" r="1.1" fill="currentColor" stroke="none"></circle>
          <circle cx="15" cy="10" r="1.1" fill="currentColor" stroke="none"></circle>
          <path d="M8.5 14c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8"></path>
        </svg>
      </div>
      <div class="iconbtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
      </div>
    </div>

  </div>

<script>
(function () {
  'use strict';

  /* ---------- 对话脚本 ---------- */
  var SCRIPT = [
    { from: 'bot', text: '在吗？' },
    { from: 'me',  text: '在的，怎么啦？' },
    { from: 'me',  text: '我想用 AI 做一个无限动画，听说可以用 git 边做边回退？' },
    { from: 'bot', text: '对，思路很简单' },
    { from: 'bot', text: '满意就 commit，不满意就 checkout / reset 回退再改' },
    { from: 'me',  text: '懂了，那我先去试试' },
    { from: 'bot', text: '👍 有不懂的随时问' }
  ];

  var chat = document.querySelector('.chat');
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // ?still 或系统开启“减少动态效果”时：一次性铺开全部消息，不播放动画
  var STILL = /[?&]still\b/.test(location.search) ||
              (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- 构造 DOM ---------- */
  function avatarFor(from) {
    var a = document.createElement('div');
    a.className = 'avatar ' + (from === 'bot' ? 'bot' : 'user');
    a.textContent = from === 'bot' ? '码' : '我';
    return a;
  }

  function rowFor(from, bubble) {
    var row = document.createElement('div');
    row.className = 'msg ' + (from === 'bot' ? 'bot' : 'me');
    row.appendChild(avatarFor(from));
    row.appendChild(bubble);
    return row;
  }

  function bubbleWith(text) {
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    return b;
  }

  function typingBubble() {
    var b = document.createElement('div');
    b.className = 'bubble typing';
    b.innerHTML = '<span></span><span></span><span></span>';
    return b;
  }

  /* ---------- 自动滚到底部 ---------- */
  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;          // 先立刻贴底
    requestAnimationFrame(function () {
      chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    });
  }

  /* ---------- 主循环 ---------- */
  async function play() {
    chat.innerHTML = '';

    if (STILL) {
      SCRIPT.forEach(function (m) {
        var b = bubbleWith(m.text);
        b.style.animation = 'none';
        chat.appendChild(rowFor(m.from, b));
      });
      scrollToBottom();
      return;
    }

    chat.style.opacity = '1';

    for (var i = 0; i < SCRIPT.length; i++) {
      var msg = SCRIPT[i];
      var typing = null;

      // 对方发消息前：先显示“正在输入”三点
      if (msg.from === 'bot') {
        typing = rowFor('bot', typingBubble());
        chat.appendChild(typing);
        scrollToBottom();
        await sleep(Math.min(1600, 650 + msg.text.length * 45));
        typing.remove();
      } else {
        await sleep(420);                        // 我方发言前的停顿
      }

      // 插入这一条消息
      var row = rowFor(msg.from, bubbleWith(msg.text));
      chat.appendChild(row);
      scrollToBottom();

      await sleep(560);                          // 两条消息之间的间隔
    }

    // 一轮播完，停一下再从头开始
    await sleep(2600);
    chat.style.opacity = '0';
    await sleep(380);
    play();
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(play);
  } else {
    play();
  }
})();
</script>
</body>
</html>
